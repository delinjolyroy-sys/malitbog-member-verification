<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Malitbog Chapter Membership Verification</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f2f2f2;
    color: #222;
}

.container {
    max-width: 500px;
    margin: 30px auto;
    padding: 20px;
}

.card {
    background: white;
    border-radius: 18px;
    padding: 25px;
    text-align: center;
    box-shadow: 0 4px 18px rgba(0,0,0,0.15);
}

.logo {
    width: 150px;
    max-width: 70%;
    margin-bottom: 15px;
}

h1 {
    font-size: 28px;
    margin: 10px 0;
}

.chapter {
    font-size: 20px;
    font-weight: bold;
    margin-bottom: 25px;
}

.photo {
    width: 190px;
    height: 190px;
    object-fit: cover;
    border-radius: 50%;
    border: 5px solid #222;
    margin: 10px auto 20px;
}

.name {
    font-size: 27px;
    font-weight: bold;
    margin: 10px 0;
}

.position {
    font-size: 20px;
    margin-bottom: 25px;
}

.details {
    text-align: left;
    background: #f7f7f7;
    border-radius: 12px;
    padding: 18px;
}

.details p {
    margin: 12px 0;
    font-size: 16px;
}

.status {
    margin-top: 20px;
    padding: 14px;
    border-radius: 10px;
    background: #dff5df;
    color: #176b17;
    font-weight: bold;
    font-size: 20px;
}

.note {
    margin-top: 20px;
    font-size: 14px;
    line-height: 1.5;
}
</style>
</head>

<body>

<div class="container">
<div class="card">

<img src="malitbog-logo-1.jpg"
     class="logo"
     alt="Malitbog Chapter Logo">

<h1>MEMBERSHIP<br>VERIFICATION</h1>

<div class="chapter">
ALPHA KAPPA RHO<br>
MALITBOG CHAPTER
</div>

<img src="amelita-magada.jpg"
     class="photo"
     alt="Amelita Magada">

<div class="name">
Amelita Magada
</div>

<div class="position">
Chairwoman
</div>

<div class="details">

<p>
<strong>Membership ID No.:</strong><br>
AKP-MLTBG-001
</p>

<p>
<strong>Date Survive:</strong><br>
May 22, 2022
</p>

<p>
<strong>Chapter:</strong><br>
Malitbog Chapter
</p>

</div>

<div class="status">
✓ LEGIT MEMBER
</div>

<div class="note">
The person whose name and picture appears here is a
<strong>LEGIT member of Alpha Kappa Rho Malitbog Chapter.</strong>
</div>

</div>
</div>

</body>
  </html>
